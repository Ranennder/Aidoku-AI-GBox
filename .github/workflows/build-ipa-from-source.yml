name: Separate UIKit banner layout diagnostic
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: ai-0.9.17
        type: string
      source_asset_sha256:
        required: true
        type: string
      expected_commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  layout-probe:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ inputs.expected_commit }}
      SOURCE_SHA: ${{ inputs.source_asset_sha256 }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Verify immutable source and copy actual banner unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/BannerProbe.app results
          gh release download "source-$SOURCE_COMMIT" --repo "$GITHUB_REPOSITORY" --pattern Aidoku-AI-source-0.9.17.zip --dir probe
          python3 <<'PY'
          import hashlib, json, os, plistlib, zipfile
          from pathlib import Path
          assert os.environ['RELEASE_TAG'] == 'ai-0.9.17'
          assert os.environ['SOURCE_COMMIT'] == 'eb8e66a16c52239282e3190725dfdd509d362b66'
          assert os.environ['SOURCE_SHA'] == '7ea567fdc83085eff053a87056d3965bdcaa472fa68ae841c1eb756652f903ab'
          archive = Path('probe/Aidoku-AI-source-0.9.17.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['SOURCE_SHA']
          with zipfile.ZipFile(archive) as source:
              assert source.comment.decode() == os.environ['SOURCE_COMMIT'] and source.testzip() is None
              actual = source.read('Aidoku-AI/Aidoku/App/Root/AppUpdateBannerView.swift')
          Path('probe/AppUpdateBannerView.swift').write_bytes(actual)
          Path('results/source.json').write_text(json.dumps({'separateDiagnostic': True,
              'source_commit': os.environ['SOURCE_COMMIT'], 'source_zip_sha256': os.environ['SOURCE_SHA'],
              'actual_banner_sha256': hashlib.sha256(actual).hexdigest(), 'actual_banner_unchanged': True}, indent=2))
          info = {'CFBundleIdentifier': 'app.ranennder.BannerLayoutProbe', 'CFBundleName': 'BannerProbe',
              'CFBundleExecutable': 'BannerProbe', 'CFBundlePackageType': 'APPL', 'CFBundleVersion': '1',
              'CFBundleShortVersionString': '1.0', 'CFBundleInfoDictionaryVersion': '6.0',
              'MinimumOSVersion': '15.0', 'UILaunchScreen': {}, 'LSRequiresIPhoneOS': True,
              'UIDeviceFamily': [1, 2], 'CFBundleSupportedPlatforms': ['iPhoneSimulator'],
              'UIApplicationSceneManifest': {'UIApplicationSupportsMultipleScenes': False,
              'UISceneConfigurations': {'UIWindowSceneSessionRoleApplication': [{'UISceneConfigurationName': 'Probe',
              'UISceneClassName': 'UIWindowScene', 'UISceneDelegateClassName': 'BannerProbe.ProbeSceneDelegate'}]}}}
          Path('probe/BannerProbe.app/Info.plist').write_bytes(plistlib.dumps(info))
          PY
      - name: Minimal UIKit host
        shell: bash
        run: |
          cat > probe/ProbeHost.swift <<'SWIFT'
          import UIKit
          struct AppUpdateRelease: Sendable { let version: String; let build: String?; let releaseURL: URL }
          func NSLocalizedString(_ key: String) -> String {
              ["APP_UPDATE_TITLE": "Update available", "APP_UPDATE_VERSION_BUILD_FORMAT": "Version %@ (%@)",
               "APP_UPDATE_VERSION_FORMAT": "Version %@", "APP_UPDATE_OPEN": "Update",
               "APP_UPDATE_OPEN_HINT": "Opens release page", "APP_UPDATE_CLOSE": "Close"][key] ?? key
          }
          @main final class ProbeAppDelegate: UIResponder, UIApplicationDelegate {
              func application(_ application: UIApplication, didFinishLaunchingWithOptions options: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  setbuf(stdout, nil)
                  print("PROBE_APPLICATION_LAUNCHED")
                  return true
              }
              func application(_ application: UIApplication, configurationForConnecting session: UISceneSession,
                               options: UIScene.ConnectionOptions) -> UISceneConfiguration {
                  let configuration = UISceneConfiguration(name: "Probe", sessionRole: session.role)
                  configuration.delegateClass = ProbeSceneDelegate.self
                  return configuration
              }
          }
          final class ProbeSceneDelegate: UIResponder, UIWindowSceneDelegate {
              var window: UIWindow?
              var measured = false
              func scene(_ scene: UIScene, willConnectTo session: UISceneSession, options: UIScene.ConnectionOptions) {
                  guard let scene = scene as? UIWindowScene else { return }
                  let window = UIWindow(windowScene: scene)
                  window.rootViewController = UIViewController()
                  self.window = window
                  window.makeKeyAndVisible()
                  print("PROBE_SCENE_CONNECTED")
              }
              func sceneDidBecomeActive(_ scene: UIScene) {
                  guard !measured else { return }
                  measured = true
                  print("PROBE_SCENE_ACTIVE")
                  DispatchQueue.main.async { self.measure() }
              }
              private func descendants(_ view: UIView) -> [UIView] { [view] + view.subviews.flatMap { descendants($0) } }
              private func measure() {
                  var cases: [[String: Any]] = []
                  for target: CGFloat in [320, 460] {
                      let host = UIView(frame: CGRect(x: 0, y: 0, width: target + 24, height: 800))
                      window!.rootViewController!.view.addSubview(host)
                      var opened = 0; var closed = 0
                      let banner = AppUpdateBannerView(release: .init(version: "0.9.18", build: "22",
                          releaseURL: URL(string: "https://github.com/Ranennder/Aidoku-AI-GBox/releases/tag/ai-0.9.18")!),
                          onOpen: { opened += 1 }, onClose: { closed += 1 })
                      banner.translatesAutoresizingMaskIntoConstraints = false
                      host.addSubview(banner)
                      let width = banner.widthAnchor.constraint(equalTo: host.safeAreaLayoutGuide.widthAnchor, constant: -24)
                      width.priority = .defaultHigh
                      NSLayoutConstraint.activate([
                          banner.topAnchor.constraint(equalTo: host.safeAreaLayoutGuide.topAnchor, constant: 8),
                          banner.centerXAnchor.constraint(equalTo: host.safeAreaLayoutGuide.centerXAnchor),
                          banner.leadingAnchor.constraint(greaterThanOrEqualTo: host.safeAreaLayoutGuide.leadingAnchor, constant: 12),
                          banner.trailingAnchor.constraint(lessThanOrEqualTo: host.safeAreaLayoutGuide.trailingAnchor, constant: -12),
                          banner.widthAnchor.constraint(lessThanOrEqualToConstant: 460), width])
                      host.setNeedsLayout(); host.layoutIfNeeded()
                      let actualHeight = banner.frame.height
                      let fitting = banner.systemLayoutSizeFitting(CGSize(width: target, height: 0),
                          withHorizontalFittingPriority: .required, verticalFittingPriority: .fittingSizeLevel)
                      let buttons = descendants(banner).compactMap { $0 as? UIButton }
                      let close = buttons.first { $0.accessibilityIdentifier == "appUpdateBannerClose" }!
                      let open = buttons.first { $0.accessibilityIdentifier == "appUpdateBannerOpen" }!
                      close.sendActions(for: .touchUpInside); open.sendActions(for: .touchUpInside)
                      let ambiguous = banner.hasAmbiguousLayout || banner.contentView.hasAmbiguousLayout
                      let passed = actualHeight >= 100 && actualHeight <= 400 && fitting.height >= 100
                          && abs(banner.frame.width - target) < 1 && !ambiguous
                          && close.frame.height >= 44 && open.frame.height >= 44 && opened == 1 && closed == 1
                      cases.append(["targetWidth": target, "frameWidth": banner.frame.width, "frameHeight": actualHeight,
                          "fittingWidth": fitting.width, "fittingHeight": fitting.height,
                          "hasAmbiguousLayout": banner.hasAmbiguousLayout,
                          "contentViewHasAmbiguousLayout": banner.contentView.hasAmbiguousLayout,
                          "contentViewTranslatesAutoresizingMask": banner.contentView.translatesAutoresizingMaskIntoConstraints,
                          "contentViewAutoresizingMask": banner.contentView.autoresizingMask.rawValue,
                          "closeHeight": close.frame.height, "openHeight": open.frame.height,
                          "openCallbacks": opened, "closeCallbacks": closed, "passed": passed])
                      host.removeFromSuperview()
                  }
                  let report: [String: Any] = ["separateDiagnostic": true, "releaseNativeCIProof": false,
                      "iosVersion": UIDevice.current.systemVersion, "cases": cases,
                      "allPassed": cases.allSatisfy { $0["passed"] as? Bool == true }]
                  let data = try! JSONSerialization.data(withJSONObject: report, options: [.prettyPrinted, .sortedKeys])
                  let url = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("layout-report.json")
                  try! data.write(to: url)
                  print("BANNER_LAYOUT_REPORT " + String(data: data, encoding: .utf8)!)
                  exit(0)
              }
          }
          SWIFT
      - name: Compile tiny simulator app
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          SDKROOT="$SDK" xcrun --sdk iphonesimulator swiftc -sdk "$SDK" -target "$(uname -m)-apple-ios15.0-simulator" -module-name BannerProbe probe/AppUpdateBannerView.swift probe/ProbeHost.swift -o probe/BannerProbe.app/BannerProbe
          codesign --force --sign - probe/BannerProbe.app
      - name: Pick available iPhone simulator
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > results/devices.json
          SIMULATOR_ID="$(python3 -c 'import json; d=json.load(open("results/devices.json")); print(next(x["udid"] for k,v in sorted(d["devices"].items(),reverse=True) if "iOS-" in k for x in v if x.get("isAvailable") and x["name"].startswith("iPhone")))')"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Selected $SIMULATOR_ID"
      - name: Boot chosen simulator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Install tiny probe
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl install "$SIMULATOR_ID" probe/BannerProbe.app
      - name: Launch probe and collect actual layout
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl launch --console --terminate-running-process "$SIMULATOR_ID" app.ranennder.BannerLayoutProbe | tee results/console.log
          CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_ID" app.ranennder.BannerLayoutProbe data)"
          cp "$CONTAINER/Documents/layout-report.json" results/layout-report.json
          python3 -c 'import json; r=json.load(open("results/layout-report.json")); assert r["separateDiagnostic"] and r["allPassed"],r'
      - name: Preserve separate diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: separate-banner-layout-probe
          path: results
          if-no-files-found: error
